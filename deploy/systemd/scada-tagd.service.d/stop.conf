# Installed with scada-tagd (decision D-59). At a stop scada-tagd waits at
# most 5 s for the retain file being written, then logs and exits at once
# with code 3 if it is still not on disk (a hung fsync). 15 s leaves room for
# that and the log. KillMode=mixed sends SIGTERM to the main process only,
# and at the timeout SIGKILL to every process left in the unit.
[Service]
TimeoutStopSec=15s
KillMode=mixed
