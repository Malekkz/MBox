# The directory of the tag database (reference 4.4; tag database contract,
# section 3.1). It is on a memory-backed file system, so it is created at
# every boot, before any service starts. Only scada-tagd can create a
# generation in it; members of the group scada can read.
d /dev/shm/scada 2750 scada-tagd scada -
# The directory of the retained values (reference 4.4; tag database
# contract, section 12). It is on disk; the line sets its owner and mode at
# every boot. scada-tagd writes it and does not create it; members of the
# group scada read it when they attach.
d /var/lib/scada/retain 2750 scada-tagd scada -
