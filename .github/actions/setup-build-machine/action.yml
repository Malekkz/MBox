# The only place that names a package manager (docs/decisions.md, D-13).
# Everything after this step uses the presets, as on a developer machine.
name: Set up the build machine
description: >
  Installs LLVM at the one version the pipeline uses, puts its tools on PATH
  under their plain names, and prints the versions of every build tool.
  Optionally builds herd7 for the model check.

inputs:
  llvm-version:
    description: LLVM major version for clang-format, clang-tidy, clang-query and Clang.
    default: "18"
  herd7:
    description: >
      "true" also builds herd7 of herdtools7 from source, for the model check
      (tests/model/README.md, decision D-37).
    default: "false"

runs:
  using: composite
  steps:
    - name: Install LLVM ${{ inputs.llvm-version }}
      shell: bash
      env:
        LLVM_VERSION: ${{ inputs.llvm-version }}
      # apt retries each download itself (Acquire::Retries); the loop also
      # retries an index that changed under it, up to four times, 10 s,
      # 20 s and 30 s apart (issue #63).
      run: |
        for attempt in 1 2 3 4; do
          if sudo apt-get -o Acquire::Retries=3 update --quiet &&
             sudo apt-get -o Acquire::Retries=3 install --yes --quiet \
               --no-install-recommends \
               "clang-${LLVM_VERSION}" "clang-format-${LLVM_VERSION}" \
               "clang-tidy-${LLVM_VERSION}" "clang-tools-${LLVM_VERSION}" \
               "libclang-rt-${LLVM_VERSION}-dev" "llvm-${LLVM_VERSION}"; then
            break
          fi
          if [ "${attempt}" = 4 ]; then
            echo "cannot install LLVM ${LLVM_VERSION}" >&2
            exit 1
          fi
          sleep $((attempt * 10))
        done

    # The build looks for `clang++`, `clang-tidy` and so on. The runner image
    # carries several LLVM versions, so the plain names are pointed at the
    # chosen one instead of at whatever the image prefers this month.
    - name: Put the LLVM tools on PATH
      shell: bash
      env:
        LLVM_VERSION: ${{ inputs.llvm-version }}
      run: |
        bin="${RUNNER_TEMP}/llvm-bin"
        mkdir -p "${bin}"
        for tool in clang clang++ clang-format clang-tidy clang-query llvm-symbolizer; do
          ln -sf "$(command -v "${tool}-${LLVM_VERSION}")" "${bin}/${tool}"
        done
        echo "${bin}" >> "${GITHUB_PATH}"
        echo "CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)" >> "${GITHUB_ENV}"

    # herd7 is not packaged by the distribution. It is built from the tag of
    # the version in third-party/dependencies.json, checked against the
    # commit listed there, with the OCaml tools of the distribution, and
    # installed with the layout `make install` of herdtools7 gives (bin/,
    # share/herdtools7/), which is where the binary looks for its models.
    # The build is cached under the commit, the runner image and a hash of
    # this file, which holds the recipe, so it runs again when one of the
    # three changes (issues #50 and #63). The binary, built or restored, is
    # checked against the version and commit it reports.
    - name: Find the herdtools7 version
      id: herdtools
      if: inputs.herd7 == 'true'
      shell: bash
      run: |
        python3 - <<'PY' >> "${GITHUB_OUTPUT}"
        import json
        with open("third-party/dependencies.json", encoding="utf-8") as f:
            entries = json.load(f)["dependencies"]
        (entry,) = [e for e in entries if e["name"] == "herdtools7"]
        print(f"version={entry['version']}")
        print(f"commit={entry['commit']}")
        PY
        echo "prefix=${RUNNER_TEMP}/herdtools7" >> "${GITHUB_OUTPUT}"
        # ImageOS and ImageVersion name the runner image: a new image can
        # bring other OCaml libraries, so it builds herd7 again.
        echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}-$(uname -m)" \
          >> "${GITHUB_OUTPUT}"
        # Any change of this file builds herd7 again: the packages, the
        # build commands and the layout are all written here.
        echo "recipe=$(sha256sum "${GITHUB_ACTION_PATH}/action.yml" | cut -c1-16)" \
          >> "${GITHUB_OUTPUT}"

    - name: Restore herd7 from the cache
      id: herd7-cache
      if: inputs.herd7 == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ steps.herdtools.outputs.prefix }}
        key: herd7-${{ steps.herdtools.outputs.commit }}-${{ steps.herdtools.outputs.image }}-${{ steps.herdtools.outputs.recipe }}

    - name: Build herd7
      if: inputs.herd7 == 'true' && steps.herd7-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        HERDTOOLS_VERSION: ${{ steps.herdtools.outputs.version }}
        HERDTOOLS_COMMIT: ${{ steps.herdtools.outputs.commit }}
        PREFIX: ${{ steps.herdtools.outputs.prefix }}
      run: |
        for attempt in 1 2 3 4; do
          if sudo apt-get -o Acquire::Retries=3 install --yes --quiet \
               --no-install-recommends ocaml-nox ocaml-dune menhir \
               libmenhir-ocaml-dev libzarith-ocaml-dev; then
            break
          fi
          if [ "${attempt}" = 4 ]; then
            echo "cannot install the OCaml packages" >&2
            exit 1
          fi
          sleep $((attempt * 10))
          sudo apt-get -o Acquire::Retries=3 update --quiet || true
        done
        src="${RUNNER_TEMP}/herdtools7-src"
        # The fetch is retried: a failed fetch of a third-party host must
        # not fail the model check on its first try.
        for attempt in 1 2 3 4; do
          rm -rf "${src}"
          if git clone --quiet --depth 1 --branch "${HERDTOOLS_VERSION}" \
              https://github.com/herd/herdtools7 "${src}"; then
            break
          fi
          if [ "${attempt}" = 4 ]; then
            echo "cannot fetch herdtools7 ${HERDTOOLS_VERSION}" >&2
            exit 1
          fi
          sleep $((attempt * 10))
        done
        test "$(git -C "${src}" rev-parse HEAD)" = "${HERDTOOLS_COMMIT}"
        cd "${src}"
        sh ./version-gen.sh "${PREFIX}"
        dune build --profile release herd/herd.exe
        mkdir -p "${PREFIX}/bin" "${PREFIX}/share/herdtools7"
        cp _build/default/herd/herd.exe "${PREFIX}/bin/herd7"
        cp -R herd/libdir "${PREFIX}/share/herdtools7/herd"

    # Also after a cache hit, which skips the check of the source commit
    # above: `herd7 -version` prints the version and the commit it was
    # built from (version-gen.sh of herdtools7).
    - name: Check herd7 and put it on PATH
      if: inputs.herd7 == 'true'
      shell: bash
      env:
        HERDTOOLS_VERSION: ${{ steps.herdtools.outputs.version }}
        HERDTOOLS_COMMIT: ${{ steps.herdtools.outputs.commit }}
        PREFIX: ${{ steps.herdtools.outputs.prefix }}
        CACHE_HIT: ${{ steps.herd7-cache.outputs.cache-hit }}
      run: |
        echo "herd7 from the cache: ${CACHE_HIT:-false}"
        reported="$("${PREFIX}/bin/herd7" -version)"
        expected="${HERDTOOLS_VERSION}, Rev: ${HERDTOOLS_COMMIT}"
        if [ "${reported}" != "${expected}" ]; then
          echo "herd7 reports '${reported}', expected '${expected}'" >&2
          exit 1
        fi
        test -f "${PREFIX}/share/herdtools7/herd/aarch64.cat"
        echo "${PREFIX}/bin" >> "${GITHUB_PATH}"

    - name: Tool versions
      shell: bash
      run: |
        echo "machine: $(uname -m), $(nproc) processors"
        cmake --version | head -n 1
        c++ --version | head -n 1
        clang++ --version | head -n 1
        clang-format --version
        clang-tidy --version | grep -i version
        python3 --version
        if command -v herd7 > /dev/null; then herd7 -version; fi
