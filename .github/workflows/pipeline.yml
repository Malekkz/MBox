# The pipeline (issue P0-04, docs/decisions.md D-13). Every job runs the same
# preset commands a developer runs; see README.md, "Pipeline".
name: pipeline

on:
  # The three default types, and two that change what a run tests: a draft
  # that becomes ready, and an edit that changes the base (D-112). An edit of
  # only the title or the description runs no job (the job `events` below).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces the run of the previous push. A run
# that tests nothing (see `events`) has a group of its own, so that it never
# cancels a real run. This is the one condition outside `events`: the
# workflow's concurrency cannot read a job's output, so it states the same
# test, which must agree with the step `decide`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ (github.event.action == 'edited' && !github.event.changes.base) && '-edit' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether this run tests anything (D-112): every run but that of an edit
  # of only a pull request's title or description. Every other job needs it,
  # runs only if `run` is true, and has its name from an expression, so that
  # a skipped check never takes the place of a real check of the same commit
  # (GitHub reads the latest check of a name, and a skipped required check
  # counts as passed): GitHub does not evaluate the name of a job its `if`
  # skips, so the check shows the name's template, never a real name.
  # `prefix` marks a job that runs anyway in such a run (`check`, if
  # `events` failed).
  events:
    name: events
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      prefix: ${{ steps.decide.outputs.prefix }}
    steps:
      - name: Decide whether this run tests anything
        id: decide
        env:
          ACTION: ${{ github.event.action }}
          BASE_CHANGED: ${{ github.event.changes.base != null }}
        run: |
          if [ "${ACTION}" = edited ] && [ "${BASE_CHANGED}" != true ]; then
            echo "run=false" >> "${GITHUB_OUTPUT}"
            echo "prefix=(not run) " >> "${GITHUB_OUTPUT}"
            echo "An edit of the title or the description: no job runs."
          else
            echo "run=true" >> "${GITHUB_OUTPUT}"
            echo "prefix=" >> "${GITHUB_OUTPUT}"
          fi

  build-test:
    name: ${{ needs.events.outputs.prefix }}build and test (${{ matrix.arch }})
    needs: events
    if: needs.events.outputs.run == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # Conformance test 3 puts the writer and the readers on separate
    # processors; on a runner with one processor it fails instead of
    # skipping (decision D-57).
    env:
      SCADA_REQUIRE_SEPARATE_CORES: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-24.04
            machine: x86_64
          - arch: ARM64
            runner: ubuntu-24.04-arm
            machine: aarch64
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build-machine

      # A runner label that resolved to the wrong architecture must not
      # produce a green ARM64 check.
      - name: Check the architecture
        run: test "$(uname -m)" = "${{ matrix.machine }}"

      - name: Build (dev)
        run: |
          cmake --preset dev
          cmake --build --preset dev
      - name: Test (dev)
        run: ctest --preset dev
      # Tests that become other users (label `root`): who may observe the
      # tag database (decision D-42). The runner user has sudo without a
      # password. For GitHub-hosted runners only, which are discarded after
      # the job: a self-hosted runner must not run tests as root.
      - name: Test as root (dev)
        run: sudo "$(command -v ctest)" --preset root

      - name: Build (release)
        run: |
          cmake --preset release
          cmake --build --preset release
      - name: Test (release)
        run: ctest --preset release
      # Conformance test 26 on the build that ships: the release build gates
      # on the criterion for SCADA_E_BUSY, which the dev run above only
      # reports (decision D-57). SCHED_FIFO needs root. Verbose, so that the
      # log holds the count of SCADA_E_BUSY and the number of reads.
      - name: False trips as root (release)
        run: >-
          sudo "$(command -v ctest)" --test-dir build/release -L '^root$'
          -R '^scada-tag-false-trip-root-test$' --verbose
          --no-tests=error

      # The performance gate (issue P1-12, decision D-57): every test with
      # the label `perf` on the `perf` build. It fails on a target of
      # reference 15.2 or contract 16 (simulator rate, wake-up latency, the
      # scan of 5,000 tags, memory, database size) on both architectures,
      # and on a median more than 2.0 times its baseline in
      # tests/perf/baseline/. Verbose, so that the log holds the figures.
      - name: Build (perf)
        run: |
          cmake --preset perf
          cmake --build --preset perf
      - name: Perf gate (perf)
        run: ctest --preset perf --verbose --no-tests=error

      - name: Staged install tree
        run: cmake --install build/release --prefix stage
      - uses: actions/upload-artifact@v6
        with:
          name: stage-${{ matrix.arch }}
          path: stage/
          if-no-files-found: error
          retention-days: 14

      # The licence report and the bill of materials of the release build
      # (issue P0-07). They are also inside the staged install tree.
      # Printed so that a reviewer can read them in the job log without
      # downloading the artifact.
      - name: Licence report and bill of materials
        run: |
          cat build/release/reports/licence-report.md
          cat build/release/reports/sbom.cdx.json
      - uses: actions/upload-artifact@v6
        with:
          name: dependency-reports-${{ matrix.arch }}
          path: build/release/reports/
          if-no-files-found: error
          retention-days: 14

  # Conformance test 4 (issue #39, decision D-37): herd7 checks the
  # sequence lock and the change ring against the Armv8 memory model, as
  # written and with each ordering taken away. The check that the ARM64
  # library compiles to what the model describes is a test of the release
  # build, so it runs in `build and test (ARM64)`.
  model-check:
    name: ${{ needs.events.outputs.prefix }}model check
    needs: events
    if: needs.events.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build-machine
        with:
          herd7: "true"
      - name: Model check (conformance test 4)
        run: |
          cmake --preset dev -DSCADA_REQUIRE_HERD7=ON
          ctest --preset model --verbose

  # The `check` target in three parts (decision D-68): the checks that read
  # every file once, clang-tidy split across N shares, and the job `check`,
  # the one result to require on `main`, which passes only if both passed and
  # the shares linted every selected unit exactly once.
  #
  # On a pull request clang-tidy lints only the translation units the pull
  # request could have affected, and everything if a file that sets the
  # rules changed or the set cannot be worked out. A push to main and a
  # manual run lint everything. The formatter, banned-function and SCADA_RT
  # checks run on every file either way (decision D-67).
  check-files:
    name: ${{ needs.events.outputs.prefix }}check (format, banned, rt)
    needs: events
    if: needs.events.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build-machine
      - name: Configure (dev)
        run: cmake --preset dev -DSCADA_CHECK_ONLY="format;banned;rt"
      # The self-tests of the selection and of the split.
      - name: Self-test of the lint selection and of the split
        run: >-
          ctest --preset dev -R '^scada-check-(selection|shares)-test$'
          --output-on-failure --no-tests=error
      - name: Formatter, banned-function and SCADA_RT checks
        run: cmake --build --preset dev --target check

  # Each share works out the same selection and lints its part of it: a
  # round-robin over the sorted list, or all of a selection of fewer than 40
  # units in share 1 (tools/check/lint_shares.py). N is the length of the
  # list `share`. The job `check` needs the record of every share.
  check-tidy:
    name: ${{ needs.events.outputs.prefix }}check (tidy ${{ matrix.share }} of ${{ strategy.job-total }})
    needs: events
    if: needs.events.outputs.run == 'true'
    runs-on: ubuntu-24.04
    # A share of a full lint takes about 10 minutes (D-68).
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        share: [1, 2, 3, 4]
    steps:
      # The whole history, so that the merge base with the target branch
      # can be found; a shallow clone lints everything.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-build-machine
      - name: Configure (dev)
        env:
          TIDY_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          TIDY_SHARE: ${{ matrix.share }}/${{ strategy.job-total }}
          TIDY_RECORD: ${{ runner.temp }}/tidy-share-${{ matrix.share }}.json
        run: >-
          cmake --preset dev -DSCADA_CHECK_TIDY_BASE="${TIDY_BASE}"
          -DSCADA_CHECK_ONLY=tidy -DSCADA_CHECK_TIDY_SHARE="${TIDY_SHARE}"
          -DSCADA_CHECK_TIDY_RECORD="${TIDY_RECORD}"
      - name: Linter, share ${{ matrix.share }} of ${{ strategy.job-total }}
        run: cmake --build --preset dev --target check
      - uses: actions/upload-artifact@v6
        with:
          name: tidy-share-${{ matrix.share }}
          path: ${{ runner.temp }}/tidy-share-${{ matrix.share }}.json
          if-no-files-found: error
          retention-days: 7

  check:
    name: ${{ needs.events.outputs.prefix }}check
    needs: [events, check-files, check-tidy]
    # Always, so that a failed, cancelled or skipped part fails this job:
    # a job left out because a needed job failed would be skipped, and a
    # skipped job counts as passed for a required check.
    if: always() && needs.events.outputs.run != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Every part of the check passed
        env:
          EVENTS_RESULT: ${{ needs.events.result }}
          FILES_RESULT: ${{ needs.check-files.result }}
          TIDY_RESULT: ${{ needs.check-tidy.result }}
        run: |
          echo "events: ${EVENTS_RESULT}"
          test "${EVENTS_RESULT}" = success
          echo "check (format, banned, rt): ${FILES_RESULT}"
          echo "check (tidy): ${TIDY_RESULT}"
          test "${FILES_RESULT}" = success
          test "${TIDY_RESULT}" = success
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          pattern: tidy-share-*
          path: ${{ runner.temp }}/tidy-records
          merge-multiple: true
      # Every share 1 to N, with the same selection, together each selected
      # unit exactly once, none with findings. Prints the totals.
      - name: Every unit linted exactly once
        run: python3 tools/check/lint_shares.py verify "${RUNNER_TEMP}"/tidy-records/tidy-share-*.json

  sanitizers:
    name: ${{ needs.events.outputs.prefix }}sanitizers (${{ matrix.preset }})
    needs: events
    if: needs.events.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SCADA_REQUIRE_SEPARATE_CORES: "1"
    strategy:
      fail-fast: false
      matrix:
        preset: [asan-ubsan, tsan]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build-machine
      - name: Build
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  fuzz:
    name: ${{ needs.events.outputs.prefix }}fuzz
    needs: events
    if: needs.events.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build-machine
      - name: Build
        run: |
          cmake --preset fuzz
          cmake --build --preset fuzz
      # Each target runs for SCADA_FUZZ_SECONDS (60 s) on one processor, so
      # targets run side by side, one per processor.
      - name: Fuzz every target
        run: ctest --preset fuzz --parallel "$(nproc)"
      - name: Keep the inputs that failed
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-findings
          path: build/fuzz/**/*-work/artifacts/
          if-no-files-found: ignore
          retention-days: 14
