# The pipeline (issue P0-04, docs/decisions.md D-13). Every job runs the same
# preset commands a developer runs; see README.md, "Pipeline".
name: pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces the run of the previous push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: build and test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-24.04
            machine: x86_64
          - arch: ARM64
            runner: ubuntu-24.04-arm
            machine: aarch64
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build-machine

      # A runner label that resolved to the wrong architecture must not
      # produce a green ARM64 check.
      - name: Check the architecture
        run: test "$(uname -m)" = "${{ matrix.machine }}"

      - name: Build (dev)
        run: |
          cmake --preset dev
          cmake --build --preset dev
      - name: Test (dev)
        run: ctest --preset dev

      - name: Build (release)
        run: |
          cmake --preset release
          cmake --build --preset release
      - name: Test (release)
        run: ctest --preset release

      # Issue P1-07 asks for the wake-up latency of a change ring consumer
      # on both targets, and this runner is the only ARM64 machine the
      # project has (decision D-32). The figures are printed, not gated on:
      # shared runners are not fit for that (D-13).
      - name: Wake-up latency, reported only (release)
        env:
          SCADA_PERF_REPORT_ONLY: "1"
        run: ctest --test-dir build/release -R '^scada-tag-wake-perf-test$' -V

      # Issue P1-10: the simulator writer sustains 50,000 updates per second
      # across 10 owners, as threads of one process and as 10 processes
      # (decision D-38). Checked, not only reported: the figure is a count
      # of updates over 10 s with a tolerance of 5 percent, not a latency.
      - name: Simulator rate (release)
        run: ctest --test-dir build/release -R '^scada-sim-rate-perf-test$' -V

      - name: Staged install tree
        run: cmake --install build/release --prefix stage
      - uses: actions/upload-artifact@v6
        with:
          name: stage-${{ matrix.arch }}
          path: stage/
          if-no-files-found: error
          retention-days: 14

      # The licence report and the bill of materials of the release build
      # (issue P0-07). They are also inside the staged install tree.
      # Printed so that a reviewer can read them in the job log without
      # downloading the artifact.
      - name: Licence report and bill of materials
        run: |
          cat build/release/reports/licence-report.md
          cat build/release/reports/sbom.cdx.json
      - uses: actions/upload-artifact@v6
        with:
          name: dependency-reports-${{ matrix.arch }}
          path: build/release/reports/
          if-no-files-found: error
          retention-days: 14

  # The figures of issue #40 (decision D-31): the retry window of a tag read
  # and the rate of SCADA_E_BUSY, on ARM64 with each pause instruction and on
  # x86-64 for comparison. Run by hand only (workflow_dispatch): it takes
  # about 20 minutes and measures, it does not pass or fail on a figure.
  arm64-measurements:
    name: measurements (${{ matrix.arch }}, ${{ matrix.pause }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-24.04
            machine: x86_64
            pause: pause
          - arch: ARM64
            runner: ubuntu-24.04-arm
            machine: aarch64
            pause: yield
          - arch: ARM64
            runner: ubuntu-24.04-arm
            machine: aarch64
            pause: isb
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build-machine
      - name: Check the architecture
        run: test "$(uname -m)" = "${{ matrix.machine }}"
      - name: Describe the machine
        run: |
          lscpu
          cat /sys/devices/system/clocksource/clocksource0/current_clocksource
      - name: Build (perf)
        env:
          # x86-64 ignores the option; isb is its default.
          PAUSE: ${{ matrix.pause == 'yield' && 'yield' || 'isb' }}
        run: |
          cmake --preset perf -B build/measure -DSCADA_ARM64_PAUSE="${PAUSE}"
          cmake --build build/measure --target \
            scada-tag-seqlock-bench scada-tag-access-integration-test
      - name: Measure
        shell: bash
        run: scripts/measure-seqlock.sh build/measure 60 600 | tee measurements.txt
      - uses: actions/upload-artifact@v6
        with:
          name: measurements-${{ matrix.arch }}-${{ matrix.pause }}
          path: measurements.txt
          if-no-files-found: error
          retention-days: 30

  check:
    name: check
    runs-on: ubuntu-24.04
    # clang-tidy takes most of this job, and its time grows with the code:
    # the job passed 15 minutes when phase 1 added its tests.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build-machine
      - name: Formatter, linter, banned-function and SCADA_RT checks
        run: |
          cmake --preset dev
          cmake --build --preset dev --target check

  sanitizers:
    name: sanitizers (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: [asan-ubsan, tsan]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build-machine
      - name: Build
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build-machine
      - name: Build
        run: |
          cmake --preset fuzz
          cmake --build --preset fuzz
      # Each target runs for SCADA_FUZZ_SECONDS (60 s) on one processor, so
      # targets run side by side, one per processor.
      - name: Fuzz every target
        run: ctest --preset fuzz --parallel "$(nproc)"
      - name: Keep the inputs that failed
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-findings
          path: build/fuzz/**/*-work/artifacts/
          if-no-files-found: ignore
          retention-days: 14
