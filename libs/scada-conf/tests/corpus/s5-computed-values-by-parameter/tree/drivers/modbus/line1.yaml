channel:
  name: line1
  type: rtu
  device: /dev/serial/by-path/platform-serial1
  baud: 9600
devices:
  - { name: ps1.m1, template: meter, unit_id: 1, params: { first: 65536, flag: 15, divisor: 1 } }
  - { name: ps1.m2, template: meter, unit_id: 2, params: { first: 70000, flag: 16, divisor: 0 } }
