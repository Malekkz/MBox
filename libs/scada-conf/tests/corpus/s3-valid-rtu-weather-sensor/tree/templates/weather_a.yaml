template: weather_a
protocol: modbus
address_base: 1
enums:
  sky: { 0: clear, 1: cloudy, 2: rain, 3: snow }
points:
  - name: temperature
    address: { table: input, register: 1, type: int16 }
    scale: { divide_by: 10 }
    unit: degC
    invalid_values: [ { raw: 0x7FFF, flags: [OUT_OF_RANGE], reason: "sensor open" } ]
    poll_group: slow
    alarms:
      - { type: low, limit: -20, priority: low, area: site }
  - name: sky
    address: { table: input, register: 2, type: uint16 }
    enum: sky
    poll_group: slow
  - name: wind
    address: { table: input, register: 3, type: uint16 }
    scale: { gain: 0.1, offset: 0 }
    unit: m/s
    poll_group: slow
