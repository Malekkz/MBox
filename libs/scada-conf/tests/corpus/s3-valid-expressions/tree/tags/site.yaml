tags:
  - name: site.sum
    type: virtual
    expr: "ps1.power.avg + sum(\"ps1.inv*.power\") - in.flow * 2 ** -1"
  - name: site.ok
    type: virtual
    expr: "NOT (site.sum.quality <> GOOD) AND site.sum.age < T#5s OR mod.x DIV 2 = 1"
  - name: site.limit
    type: virtual
    expr: "if(site.ok, limit(0, site.sum, 100), -1.5e2)"
  - { name: ps1.power.avg, type: internal, value_type: float64 }
  - { name: ps1.inv1.power, type: internal, value_type: float64 }
  - { name: ps1.inv2.power, type: internal, value_type: int64 }
  - { name: in.flow, type: internal, value_type: float64 }
  - { name: mod.x, type: internal, value_type: int64 }
  - { name: site.a, type: internal, value_type: int64 }
  - { name: site.b, type: internal, value_type: float64 }
  - { name: site.pump-1.ok, type: internal, value_type: bool }
  - { name: site.trip, type: internal, value_type: bool }
