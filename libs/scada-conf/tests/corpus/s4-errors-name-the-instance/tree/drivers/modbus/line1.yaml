channel:
  name: line1
  type: rtu
  device: /dev/serial/by-path/platform-serial1
  baud: 9600
devices:
  - { name: ps1.m1, template: meter_a, unit_id: 1 }
  - { name: ps1.m2, template: meter_a, unit_id: 2, params: { scale: 0 } }
  - { name: ps1.m3, template: meter_a, unit_id: 3, params: { scale: 0 } }
  - { name: ps1.m4, template: meter_a, unit_id: 4, overrides: { flwo: { unit: l } } }
