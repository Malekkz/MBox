tags:
  - { name: ps1.inv1.power, type: internal, value_type: float64, unit: kW }
  - { name: ps1.inv2.power, type: internal, value_type: float64, unit: kW }
  - { name: site.load.power, type: internal, value_type: float64, unit: kW }
  - { name: site.note, type: internal, value_type: string }
  - name: site.pv.total_power
    type: virtual
    expr: sum("ps1.inv*.power")
    unit: kW
    task: normal
    quality: ignore_bad
    logging: process_default
  - name: site.net_power
    type: virtual
    expr: site.pv.total_power - site.load.power
    unit: kW
    logging: { policy: process_default, interval: 1s }
  - name: ps1.tank.level_sp
    type: manual
    value_type: float64
    area: ps1
    limits: { min: 0, max: 5 }
    initial: 2.5
    retain: true
